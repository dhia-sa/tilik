[package]
name = "spendview"
version = "0.1.0"
edition = "2021"
description = "SpendView - dashboard spend, harga komoditas & performa vendor"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] } # std -> rand_core/getrandom untuk OsRng (salt password)
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rust_xlsxwriter = "0.90"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
regex = "1"
tempfile = "3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
